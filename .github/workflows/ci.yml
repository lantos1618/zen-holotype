name: CI

# The real merge gate, exactly as run locally before every merge. Zero Python:
# the compiler is 100% self-hosted — cc compiles the committed C seed, the
# freshly-built zenc runs the Zen-native harness, then rebuilds its own seed to
# prove the committed bootstrap/zenc.gen.c is at fixpoint with the .zen source.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (force-pushes stop spamming failures).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # MUST come after checkout: this step used to run BEFORE it, where `git grep` exits 128
      # ("not a git repository") and the leading `!` turned that into a pass — the gate could not
      # fail. Shares its pattern with integrate.sh gate 0 rather than keeping a second copy.
      - name: no conflict markers (tree must never carry <<<<<<< / ======= / >>>>>>>)
        run: bash scripts/no-conflict-markers.sh

      # The harness's examples leak gate (scripts/leak-sweep.sh) runs every example under valgrind and
      # FAILS if valgrind is absent rather than skipping — a gate that quietly stands down on a runner
      # image change is not a gate. Installed explicitly so that failure can only ever mean a leak.
      - name: Install valgrind (required by the examples leak gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      # 1. Build the compiler: cc (gnu11, -fwrapv) on bootstrap/{zenc.gen.c,zenrt.c}.
      #    No deps beyond a C compiler + make.
      - name: Build zenc
        run: make -f bootstrap/Makefile zen

      # 2a. Fast-fail smoke subset of the harness: value + verdict suites only.
      - name: Harness (fast subset)
        run: make -f bootstrap/Makefile harness-fast

      # 2b. The full Zen-native harness (tests/harness.zen) — the merge gate.
      #     Exit 0 means all pass; any failure returns 1.
      #
      #     The pool/inner defaults (6x8, up to 48 concurrent cc+zen processes) are measured for the
      #     16-core dev box; a GitHub runner has 4. Inheriting them here took the runner down mid-step
      #     ("the runner has received a shutdown signal", exit 143) rather than failing any test. Pin
      #     the fan-out to the runner's actual width — the suites and their verdicts are unchanged.
      - name: Harness (full)
        env:
          ZO_SUITE_POOL: "3"
          ZO_SUITE_INNER: "4"
        run: make -f bootstrap/Makefile harness

      # 3. Formatting gate: every .zen in the tree must be zenc-fmt clean.
      #    The file set lives in scripts/fmt-check.sh, shared with integrate.sh gate 5 — CI's
      #    copy had drifted (it omitted tools/), so a misformatted tools/*.zen passed here.
      - name: fmt --check (tree is zenc-fmt clean)
        run: bash scripts/fmt-check.sh

      - name: Documentation inventory and links
        run: make docs-check

      # 3b. FFI drift gate: std's hand-written foreign prototypes must match the REAL
      #     system headers (glibc). `zenc emit` lowers each foreign decl to a bare C
      #     prototype; the gate compares them against the headers' declarations —
      #     libm verbatim (conflicting-types hard error), the rest slot-by-slot at
      #     ABI-class level via g++ static_asserts. Fast (~2s).
      - name: FFI prototypes vs system headers
        run: make -f bootstrap/Makefile ffi-verify

      # 4. Seed fixpoint: zenc regenerates its own bootstrap C; the result must be
      #    byte-identical to the committed seed. Catches stale-seed commits (the #1
      #    historical footgun: committing source changes without regenerating the seed).
      - name: Seed fixpoint (self-build, committed seed must be byte-exact)
        run: |
          ./zen --build-self bootstrap/zenc.gen.c .
          if ! git diff --exit-code -- bootstrap/zenc.gen.c; then
            echo "::error::bootstrap/zenc.gen.c is stale — run 'make -f bootstrap/Makefile regen' and commit the regenerated seed"
            exit 1
          fi

  # Sanitizer sweep: the compiler built with ASan+UBSan, run over the whole fixture corpus.
  # Separate job because the instrumented rebuild is slow and it must not gate the fast `gate` job.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ASan+UBSan compiler and sweep the corpus
        run: make -f bootstrap/Makefile asan
