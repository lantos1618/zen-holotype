name: Release

# Push a tag like `v0.1.0` to cut a release. Runs the same Python-free gate as
# CI (build + harness + seed fixpoint), then packages the source tarball and the
# zenc binary, and dry-runs a build from the tarball before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build zenc
        run: make -f bootstrap/Makefile zen

      - name: Harness (full)
        run: make -f bootstrap/Makefile harness

      - name: Documentation inventory and links
        run: make docs-check

      - name: Seed fixpoint (self-build, committed seed must be byte-exact)
        run: |
          ./zen --build-self bootstrap/zenc.gen.c .
          if ! git diff --exit-code -- bootstrap/zenc.gen.c; then
            echo "::error::bootstrap/zenc.gen.c is stale — run 'make -f bootstrap/Makefile regen' and commit the regenerated seed"
            exit 1
          fi

      - name: Package source + bootstrap artifacts
        run: |
          mkdir -p dist
          cp zen dist/zen
          tar czf dist/zen-${{ github.ref_name }}-src.tar.gz \
            README.md SPEC.md ARCHITECTURE.md MEMORY_MODEL.md STATUS.md \
            Makefile .gitattributes .gitignore \
            bootstrap src driver.zen examples tests scripts

      - name: Release dry-run (tarball builds and self-checks from scratch)
        run: |
          rm -rf /tmp/relcheck && mkdir -p /tmp/relcheck
          tar xzf dist/zen-${{ github.ref_name }}-src.tar.gz -C /tmp/relcheck
          cd /tmp/relcheck
          make -f bootstrap/Makefile zen
          make -f bootstrap/Makefile harness-fast
          cp bootstrap/zenc.gen.c /tmp/zenc.gen.c.before
          ./zen --build-self bootstrap/zenc.gen.c .
          cmp -s /tmp/zenc.gen.c.before bootstrap/zenc.gen.c

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/zen-${{ github.ref_name }}-src.tar.gz
            dist/zen
