name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The editor package targets Node 20, and grammar/package.json owns the
      # compatible tree-sitter CLI range used by the Makefile's parse gate.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install tree-sitter CLI
        run: npm install --prefix grammar --no-package-lock --no-audit --no-fund

      - name: Verify repository
        run: make verify
